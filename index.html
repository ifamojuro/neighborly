document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

sor:pointer\">←<\u002Fbutton>\n          <div style=\"position:absolute;left:14px;bottom:-16px;display:flex;gap:6px\">\n            <span style=\"padding:6px 12px;background:#ec7a4f;border:2px solid #1d2a24;border-radius:12px;box-shadow:2px 2px 0 #1d2a24;font:800 13px Nunito,sans-serif\">{{ iss.cat }}<\u002Fspan>\n            <span style=\"padding:6px 12px;background:{{ iss.statusBg }};border:2px solid #1d2a24;border-radius:12px;box-shadow:2px 2px 0 #1d2a24;font:800 13px Nunito,sans-serif\">{{ iss.statusLabel }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:26px 18px 28px;display:flex;flex-direction:column;gap:16px\">\n          <div style=\"display:flex;flex-direction:column;gap:6px\">\n            <h1 style=\"margin:0;font:600 28px/1.1 Fredoka,sans-serif;letter-spacing:-.01em;text-wrap:pretty\">{{ iss.title }}<\u002Fh1>\n            <span style=\"font:700 13px Nunito,sans-serif;color:#5b6b63\">{{ iss.meta }}<\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"margin:0;font:600 16px/1.5 Nunito,sans-serif;color:#33413a;text-wrap:pretty\">{{ iss.desc }}<\u002Fp>\n          <div style=\"display:flex;gap:6px\">\n            <sc-for list=\"{{ steps }}\" as=\"st\" hint-placeholder-count=\"3\"><div style=\"flex:1;display:flex;flex-direction:column;gap:6px\"><div style=\"height:12px;border-radius:99px;border:2px solid #1d2a24;background:{{ st.bg }}\"><\u002Fdiv><span style=\"font:800 12px Nunito,sans-serif;color:{{ st.fg }}\">{{ st.label }}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n          <\u002Fdiv>\n          <sc-if value=\"{{ isRes }}\" hint-placeholder-val=\"{{ true }}\">\n            <button sc-camel-on-click=\"{{ onUpvote }}\" style=\"width:100%;padding:15px 18px;background:{{ upBg }};color:#1d2a24;border:2px solid #1d2a24;border-radius:16px;box-shadow:3px 3px 0 #1d2a24;font:800 17px Nunito,sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px\" style-active=\"transform:translate(2px,2px);box-shadow:1px 1px 0 #1d2a24\"><span style=\"font-size:15px\">▲<\u002Fspan>{{ upLabel }}<span style=\"padding:2px 10px;border-radius:999px;background:#fffdf8;border:2px solid #1d2a24;font:600 16px Fredoka,sans-serif\">{{ iss.votes }}<\u002Fspan><\u002Fbutton>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ iss.hasEvent }}\" hint-placeholder-val=\"{{ false }}\">\n            <button sc-camel-on-click=\"{{ iss.openEvent }}\" style=\"display:flex;align-items:center;gap:12px;padding:12px;text-align:left;background:#e3edfc;border:2px solid #1d2a24;border-radius:18px;cursor:pointer;box-shadow:2px 2px 0 #1d2a24\">\n              <div style=\"width:46px;height:46px;flex:none;border:2px solid #1d2a24;border-radius:12px;background:#4a86e0;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1\"><span style=\"font:800 10px Nunito,sans-serif\">{{ iss.evTop }}<\u002Fspan><span style=\"font:600 19px Fredoka,sans-serif\">{{ iss.evDay }}<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:2px\"><span style=\"font:800 15px Nunito,sans-serif\">{{ iss.evTitle }}<\u002Fspan><span style=\"font:700 13px Nunito,sans-serif;color:#2c5db0\">Help fix this · RSVP →<\u002Fspan><\u002Fdiv>\n            <\u002Fbutton>\n          <\u002Fsc-if>\n          <div style=\"display:flex;align-items:baseline;justify-content:space-between\"><h3 style=\"margin:0;font:600 19px Fredoka,sans-serif\">Who's on it<\u002Fh3><span style=\"font:700 13px Nunito,sans-serif;color:#5b6b63\">{{ iss.orgCount }}<\u002Fspan><\u002Fdiv>\n          <sc-for list=\"{{ orgsOn }}\" as=\"o\" hint-placeholder-count=\"1\">\n            <div style=\"display:flex;align-items:center;gap:12px;padding:10px;background:#fffdf8;border:2px solid #1d2a24;border-radius:16px\">\n              <div style=\"width:40px;height:40px;flex:none;border-radius:13px;border:2px solid #1d2a24;background:{{ o.color }};color:#fff;font:700 14px Fredoka,sans-serif;display:flex;align-items:center;justify-content:center\">{{ o.init }}<\u002Fdiv>\n              <div style=\"flex:1;display:flex;flex-direction:column;gap:1px\"><span style=\"font:800 15px Nunito,sans-serif\">{{ o.name }}<\u002Fspan><span style=\"font:600 13px Nunito,sans-serif;color:#5b6b63\">{{ o.role }}<\u002Fspan><\u002Fdiv>\n              <sc-if value=\"{{ o.lead }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"padding:3px 9px;border-radius:999px;border:2px solid #1d2a24;background:#f7c948;font:800 11px Nunito,sans-serif\">LEAD<\u002Fspan><\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <sc-if value=\"{{ iss.noOrgs }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"padding:14px;border:2px dashed #1d2a24;border-radius:16px;font:700 14px/1.45 Nunito,sans-serif;color:#3f4d46\">{{ iss.noOrgsText }}<\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ isOrg }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;flex-direction:column;gap:12px\">\n              <sc-if value=\"{{ iss.hasFit }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"padding:12px 14px;background:#ece6fb;border:2px solid #1d2a24;border-radius:16px;font:700 14px/1.4 Nunito,sans-serif\"><span style=\"color:#6447c2\">✦ Good fit for Green Elm<\u002Fspan> — {{ iss.fit }}<\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ volClosed }}\" hint-placeholder-val=\"{{ false }}\">\n                <button sc-camel-on-click=\"{{ openVol }}\" style=\"width:100%;padding:15px 18px;background:#ec7a4f;border:2px solid #1d2a24;border-radius:16px;box-shadow:3px 3px 0 #1d2a24;font:800 17px Nunito,sans-serif;cursor:pointer\">Volunteer to fix this<\u002Fbutton>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ volOpen }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"display:flex;flex-direction:column;gap:12px;padding:16px;background:#fde6dc;border:2px solid #1d2a24;border-radius:20px;box-shadow:4px 4px 0 #1d2a24\">\n                  <span style=\"font:600 20px Fredoka,sans-serif\">How will Green Elm help?<\u002Fspan>\n                  <textarea value=\"{{ volPlan }}\" sc-camel-on-change=\"{{ onVolPlan }}\" placeholder=\"e.g. Our crew can clear it Saturday morning.\" style=\"min-height:80px;padding:12px;border:2px solid #1d2a24;border-radius:14px;background:#fffdf8;font:600 15px Nunito,sans-serif;resize:vertical\"><\u002Ftextarea>\n                  <span style=\"font:700 13px Nunito,sans-serif;color:#5b6b63\">Shared publicly with neighbors<\u002Fspan>\n                  <div style=\"display:flex;gap:6px;flex-wrap:wrap\"><sc-for list=\"{{ volWhens }}\" as=\"v\" hint-placeholder-count=\"3\"><button sc-camel-on-click=\"{{ v.onClick }}\" style=\"padding:7px 12px;border:2px solid #1d2a24;border-radius:999px;font:800 13px Nunito,sans-serif;cursor:pointer;background:{{ v.bg }};color:{{ v.fg }}\">{{ v.label }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n                  <button sc-camel-on-click=\"{{ toggleVolEvent }}\" style=\"display:flex;align-items:center;gap:10px;border:none;background:transparent;padding:0;cursor:pointer;font:700 15px/1.3 Nunito,sans-serif;text-align:left\"><span style=\"width:24px;height:24px;flex:none;border:2px solid #1d2a24;border-radius:7px;background:{{ volEventBg }};color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px\">{{ volEventMark }}<\u002Fspan>Also post a fix-it event residents can RSVP to<\u002Fbutton>\n                  <button sc-camel-on-click=\"{{ doVolunteer }}\" style=\"width:100%;padding:14px;background:#2f6f4f;color:#fff;border:2px solid #1d2a24;border-radius:16px;box-shadow:3px 3px 0 #1d2a24;font:800 16px Nunito,sans-serif;cursor:pointer\">Volunteer<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ iss.weOnIt }}\" hint-placeholder-val=\"{{ false }}\">\n                <button sc-camel-on-click=\"{{ openCoord }}\" style=\"width:100%;padding:15px 18px;background:#2f6f4f;color:#fff;border:2px solid #1d2a24;border-radius:16px;box-shadow:3px 3px 0 #1d2a24;font:800 17px Nunito,sans-serif;cursor:pointer\">Open coordination space →<\u002Fbutton>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <h3 style=\"margin:6px 0 0;font:600 19px Fredoka,sans-serif\">Updates<\u002Fh3>\n          <div style=\"display:flex;flex-direction:column;gap:12px;border-left:3px solid #1d2a24;margin-left:6px;padding-left:16px\">\n            <sc-for list=\"{{ iss.updates }}\" as=\"u\" hint-placeholder-count=\"2\"><div style=\"display:flex;flex-direction:column;gap:2px;position:relative\"><span style=\"position:absolute;left:-25px;top:3px;width:14px;height:14px;border-radius:50%;background:#f7c948;border:2px solid #1d2a24\"><\u002Fspan><span style=\"font:800 14px Nunito,sans-serif\">{{ u.who }} <span style=\"font-weight:600;color:#5b6b63\">· {{ u.when }}<\u002Fspan><\u002Fspan><span style=\"font:600 15px/1.4 Nunito,sans-serif;color:#33413a\">{{ u.text }}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- REPORT FLOW -->\n    <sc-if value=\"{{ showReport }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;flex-direction:column\">\n        <sc-if value=\"{{ repHeader }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:14px 18px 0;display:flex;align-items:center;gap:12px\">\n            <button sc-camel-on-click=\"{{ repBack }}\" style=\"width:40px;height:40px;flex:none;border-radius:50%;background:#fffdf8;border:2px solid #1d2a24;font:800 16px Nunito,sans-serif;cursor:pointer\">←<\u002Fbutton>\n            <div style=\"flex:1;display:flex;flex-direction:column;gap:6px\"><span style=\"font:800 12px Nunito,sans-serif;letter-spacing:.06em;color:#5b6b63;text-transform:uppercase\">{{ repStepLabel }}<\u002Fspan><div style=\"height:12px;border:2px solid #1d2a24;border-radius:99px;background:#fffdf8;overflow:hidden\"><div style=\"height:100%;width:{{ repPct }};background:#ec7a4f;border-right:2px solid #1d2a24\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n            <button sc-camel-on-click=\"{{ cancelReport }}\" style=\"width:40px;height:40px;flex:none;border-radius:50%;background:#fffdf8;border:2px solid #1d2a24;font:800 14px Nunito,sans-serif;cursor:pointer\">✕<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ rep0 }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:18px 20px 28px;display:flex;flex-direction:column;gap:16px\">\n            <div style=\"display:flex;justify-content:space-between;align-items:center\"><span style=\"font:800 13px Nunito,sans-serif;letter-spacing:.06em;color:#b44a22;text-transform:uppercase\">Report an issue<\u002Fspan><button sc-camel-on-click=\"{{ cancelReport }}\" style=\"width:40px;height:40px;border-radius:50%;background:#fffdf8;border:2px solid #1d2a24;font:800 14px Nunito,sans-serif;cursor:pointer\">✕<\u002Fbutton><\u002Fdiv>\n            <div style=\"height:210px;border:2px solid #1d2a24;border-radius:26px;background:#fde6dc;box-shadow:4px 4px 0 #1d2a24;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden\">\n              <div style=\"position:absolute;width:260px;height:260px;border-radius:50%;border:2px dashed #ec7a4f\"><\u002Fdiv>\n              <div style=\"width:150px;height:150px;border-radius:50%;background:#fbd0bd;border:2px dashed #1d2a24;display:flex;align-items:center;justify-content:center\"><div style=\"width:62px;height:62px;border-radius:18px;background:#ec7a4f;border:3px solid #1d2a24;box-shadow:3px 3px 0 #1d2a24;transform:rotate(45deg)\"><\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <h1 style=\"margin:0;font:600 30px/1.08 Fredoka,sans-serif;text-wrap:pretty\">Spotted something on your block?<\u002Fh1>\n            <p style=\"margin:0;font:600 16px/1.5 Nunito,sans-serif;color:#3f4d46;text-wrap:pretty\">We'll drop a pin right where you're standing so neighbors and local orgs can find it and pitch in.<\u002Fp>\n            <button sc-camel-on-click=\"{{ locate }}\" style=\"width:100%;padding:15px 18px;background:#2f6f4f;color:#fff;border:2px solid #1d2a24;border-radius:16px;box-shadow:3px 3px 0 #1d2a24;font:800 17px Nunito,sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px\"><span style=\"width:14px;height:14px;border-radius:50%;border:3px solid #fff\"><\u002Fspan>{{ locateLabel }}<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ locate }}\" style=\"border:none;background:transparent;font:800 14px Nunito,sans-serif;color:#2f6f4f;text-decoration:underline;cursor:pointer\">Enter an address instead<\u002Fbutton>\n            <span style=\"font:600 13px Nunito,sans-serif;color:#5b6b63;text-align:center\">Your exact location is only used to place the pin.<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ rep1 }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:16px 18px 22px;display:flex;flex-direction:column;gap:12px\">\n            <h2 style=\"margin:0;font:600 24px Fredoka,sans-serif\">Is this the spot?<\u002Fh2>\n            <div style=\"display:flex;align-items:center;gap:12px;padding:12px;background:#fffdf8;border:2px solid #1d2a24;border-radius:16px\">\n              <span style=\"width:16px;height:16px;flex:none;background:#ec7a4f;border:2px solid #1d2a24;border-radius:4px;transform:rotate(45deg)\"><\u002Fspan>\n              <div style=\"display:flex;flex-direction:column\"><span style=\"font:800 15px Nunito,sans-serif\">{{ repAddr }}<\u002Fspan><span style=\"font:600 13px Nunito,sans-serif;color:#5b6b63\">From your GPS · accurate to about 12 m<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n            <span style=\"font:600 14px Nunito,sans-serif;color:#5b6b63\">Drag the pin on the map to nudge it.<\u002Fspan>\n            <button sc-camel-on-click=\"{{ confirmSpot }}\" style=\"width:100%;padding:14px;background:#2f6f4f;color:#fff;border:2px solid #1d2a24;border-radius:16px;box-shadow:3px 3px 0 #1d2a24;font:800 16px Nunito,sans-serif;cursor:pointer\">Yep, that's it<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ rep2 }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:18px 18px 26px;display:flex;flex-direction:column;gap:14px\">\n            <h2 style=\"margin:0;font:600 26px/1.1 Fredoka,sans-serif\">Already reported nearby?<\u002Fh2>\n            <p style=\"margin:0;font:600 15px/1.45 Nunito,sans-serif;color:#3f4d46\">Upvoting an existing issue gets it fixed faster than posting a duplicate.<\u002Fp>\n            <sc-for list=\"{{ dupes }}\" as=\"d\" hint-placeholder-count=\"2\">\n              <div style=\"display:flex;align-items:center;gap:12px;padding:10px;background:#fffdf8;border:2px solid #1d2a24;border-radius:18px;box-shadow:3px 3px 0 #1d2a24\">\n                <div style=\"width:50px;height:50px;flex:none;border:2px solid #1d2a24;border-radius:14px;background:#fde6dc;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1\"><span style=\"font:800 11px Nunito,sans-serif;color:#b44a22\">▲<\u002Fspan><span style=\"font:600 20px Fredoka,sans-serif\">{{ d.votes }}<\u002Fspan><\u002Fdiv>\n                <div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:2px\"><span style=\"font:700 15px/1.2 Nunito,sans-serif\">{{ d.title }}<\u002Fspan><span style=\"font:600 13px Nunito,sans-serif;color:#5b6b63\">{{ d.sub }}<\u002Fspan><\u002Fdiv>\n                <button sc-camel-on-click=\"{{ d.up }}\" style=\"flex:none;padding:8px 12px;background:#ec7a4f;border:2px solid #1d2a24;border-radius:12px;font:800 13px Nunito,sans-serif;cursor:pointer\">▲ Me too<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <button sc-camel-on-click=\"{{ toDetails }}\" style=\"width:100%;padding:14px;background:#fffdf8;border:2px solid #1d2a24;border-radius:16px;box-shadow:3px 3px 0 #1d2a24;font:800 16px Nunito,sans-serif;cursor:pointer\">Mine's something new<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ rep3 }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:18px 18px 26px;display:flex;flex-direction:column;gap:14px\">\n            <h2 style=\"margin:0;font:600 26px Fredoka,sans-serif\">What's going on?<\u002Fh2>\n            <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px\">\n              <sc-for list=\"{{ cats }}\" as=\"c\" hint-placeholder-count=\"6\"><button sc-camel-on-click=\"{{ c.onClick }}\" style=\"padding:14px 6px;border:2px solid #1d2a24;border-radius:16px;font:800 14px Nunito,sans-serif;cursor:pointer;background:{{ c.bg }};color:{{ c.fg }};box-shadow:{{ c.sh }}\">{{ c.label }}<\u002Fbutton><\u002Fsc-for>\n            <\u002Fdiv>\n            <label style=\"display:flex;flex-direction:column;gap:6px;font:800 14px Nunito,sans-serif\">Short title<input value=\"{{ rTitle }}\" sc-camel-on-change=\"{{ onTitle }}\" placeholder=\"e.g. Streetlight out on the corner\" style=\"padding:12px;border:2px solid #1d2a24;border-radius:14px;background:#fffdf8;font:600 15px Nunito,sans-serif\"><\u002Flabel>\n            <label style=\"display:flex;flex-direction:column;gap:6px;font:800 14px Nunito,sans-serif\">Details<textarea value=\"{{ rDesc }}\" sc-camel-on-change=\"{{ onDesc }}\" placeholder=\"What did you notice? How long has it been like this?\" style=\"min-height:80px;padding:12px;border:2px solid #1d2a24;border-radius:14px;background:#fffdf8;font:600 15px Nunito,sans-serif;resize:vertical\"><\u002Ftextarea><\u002Flabel>\n            <div style=\"display:flex;gap:10px;align-items:stretch\">\n              <button sc-camel-on-click=\"{{ togglePhoto }}\" style=\"width:96px;height:80px;flex:none;border:2px dashed #1d2a24;border-radius:16px;background:{{ photoBg }};font:800 13px Nunito,sans-serif;cursor:pointer\">{{ photoLabel }}<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ toggleAnon }}\" style=\"flex:1;display:flex;align-items:center;gap:10px;padding:10px;border:2px solid #1d2a24;border-radius:16px;background:#fffdf8;cursor:pointer;text-align:left;font:700 14px/1.3 Nunito,sans-serif\"><span style=\"width:24px;height:24px;flex:none;border:2px solid #1d2a24;border-radius:7px;background:{{ anonBg }};color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px\">{{ anonMark }}<\u002Fspan>Post without my name<\u002Fbutton>\n            <\u002Fdiv>\n            <button sc-camel-on-click=\"{{ toAI }}\" style=\"width:100%;padding:14px;background:#2f6f4f;color:#fff;border:2px solid #1d2a24;border-radius:16px;box-shadow:3px 3px 0 #1d2a24;font:800 16px Nunito,sans-serif;cursor:pointer;opacity:{{ nextOp }}\">Next<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ rep4 }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:18px 18px 26px;display:flex;flex-direction:column;gap:14px\">\n            <span style=\"align-self:flex-start;padding:5px 11px;border:2px solid #1d2a24;border-radius:999px;background:#ece6fb;font:800 12px Nunito,sans-serif;color:#6447c2\">✦ AI SUGGESTION<\u002Fspan>\n            <h2 style=\"margin:0;font:600 26px/1.1 Fredoka,sans-serif\">Who could help with this?<\u002Fh2>\n            <p style=\"margin:0;font:600 15px/1.45 Nunito,sans-serif;color:#3f4d46;text-wrap:pretty\">{{ aiIntro }}<\u002Fp>\n            <sc-for list=\"{{ sugg }}\" as=\"o\" hint-placeholder-count=\"3\">\n              <button sc-camel-on-click=\"{{ o.pick }}\" style=\"display:flex;align-items:flex-start;gap:12px;padding:12px;text-align:left;background:{{ o.bg }};border:2px solid #1d2a24;border-radius:18px;box-shadow:{{ o.sh }};cursor:pointer\">\n                <span style=\"width:22px;height:22px;flex:none;margin-top:2px;border-radius:50%;border:2px solid #1d2a24;background:#fffdf8;display:flex;align-items:center;justify-content:center\"><span style=\"width:10px;height:10px;border-radius:50%;background:{{ o.dot }}\"><\u002Fspan><\u002Fspan>\n                <div style=\"flex:1;display:flex;flex-direction:column;gap:3px\">\n                  <span style=\"font:800 16px Nunito,sans-serif\">{{ o.name }} <sc-if value=\"{{ o.best }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"margin-left:4px;padding:2px 8px;border-radius:999px;border:2px solid #1d2a24;background:#f7c948;font:800 10px Nunito,sans-serif;vertical-align:2px\">BEST MATCH<\u002Fspan><\u002Fsc-if><\u002Fspan>\n                  <span style=\"font:600 13px/1.4 Nunito,sans-serif;color:#3f4d46\">{{ o.reason }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n            <button sc-camel-on-click=\"{{ postSend }}\" style=\"width:100%;padding:14px;background:#2f6f4f;color:#fff;border:2px solid #1d2a24;border-radius:16px;box-shadow:3px 3px 0 #1d2a24;font:800 16px Nunito,sans-serif;cursor:pointer\">{{ sendLabel }}<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ postSkip }}\" style=\"border:none;background:transparent;font:800 14px Nunito,sans-serif;color:#2f6f4f;text-decoration:underline;cursor:pointer\">Skip — just post it to the map<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- COORDINATION -->\n    <sc-if value=\"{{ showCoord }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"padding:16px 20px 28px;display:flex;flex-direction:column;gap:16px\">\n        <div style=\"display:flex;align-items:center;gap:12px\">\n          <button sc-camel-on-click=\"{{ coordBack }}\" style=\"width:42px;height:42px;flex:none;border-radius:50%;background:#fffdf8;border:2px solid #1d2a24;box-shadow:2px 2px 0 #1d2a24;font:800 16px Nunito,sans-serif;cursor:pointer\">←<\u002Fbutto
